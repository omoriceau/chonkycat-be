# sonar-project.properties
# Config for the SonarQube/SonarCloud scan in .github/workflows/sonarqube.yml.

sonar.projectKey=omoriceau_chonkycat-be
sonar.organization=omoriceau

sonar.sources=lambdas,shared
sonar.tests=lambdas
sonar.test.inclusions=**/tests/**,**/test_*.py

sonar.python.version=3.13

sonar.exclusions=**/.aws-sam/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/*.egg-info/**,**/events/**
sonar.coverage.exclusions=**/tests/**,**/test_*.py

# Generated per-lambda by .github/workflows/sonarqube.yml, only for
# lambdas with a requirements-dev.txt (see CICD.md). Wildcard so newly
# opted-in lambdas pick up automatically.
sonar.python.coverage.reportPaths=lambdas/*/coverage.xml
