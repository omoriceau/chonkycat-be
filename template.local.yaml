AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ChonkyChonk Backend - Local Development

# ============================================================
# Global defaults for local development
# ============================================================
Globals:
  Function:
    Runtime:       python3.13
    MemorySize:    256
    Timeout:       30
    Architectures: [x86_64]
    Environment:
      Variables:
        DB_HOST:         chonkychonk-db
        DB_PORT:         "5432"
        DB_USER:         chonky_admin
        DB_PASSWORD:     Ch0nky_Secure_P4ss_2026!
        DB_NAME:         chonky
        EVENT_BUS_NAME:  chonkychonk-bus

# ============================================================
# Resources — local dev only (no RDS/Secrets/SNS)
# ============================================================
Resources:

  # ----------------------------------------------------------
  # EventBridge bus (local testing only)
  # ----------------------------------------------------------
  ChonkyEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: chonkychonk-bus

  # ----------------------------------------------------------
  # Products Lambda  —  GET /products
  # ----------------------------------------------------------
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: chonkychonk-products-local
      CodeUri:      lambdas/products
      Handler:      lambda_handler.lambda_handler
      Description:  GET /products
      Events:
        GetProducts:
          Type: Api
          Properties:
            Path:   /products
            Method: GET

  # ----------------------------------------------------------
  # Users Lambda  —  GET /users/{id}
  # ----------------------------------------------------------
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: chonkychonk-users-local
      CodeUri:      lambdas/users
      Handler:      lambda_handler.lambda_handler
      Description:  GET /users/{id}
      Environment:
        Variables:
          COGNITO_ENABLED:       "false"
          COGNITO_USER_POOL_ID:  ""
          COGNITO_APP_CLIENT_ID: ""
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: chonkychonk-bus
      Events:
        GetUser:
          Type: Api
          Properties:
            Path:   /users/{id}
            Method: GET

  # ----------------------------------------------------------
  # Orders Lambda  —  POST /orders
  # ----------------------------------------------------------
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: chonkychonk-orders-local
      CodeUri:      lambdas/orders
      Handler:      lambda_handler.lambda_handler
      Description:  POST /orders
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: chonkychonk-bus
      Events:
        CreateOrder:
          Type: Api
          Properties:
            Path:   /orders
            Method: POST

  # ----------------------------------------------------------
  # Payments Lambda  —  EventBridge target (OrderCreated)
  # ----------------------------------------------------------
  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: chonkychonk-payments-local
      CodeUri:      lambdas/payments
      Handler:      lambda_handler.lambda_handler
      Description:  Processes charges and refunds
      Timeout:      30
      Environment:
        Variables:
          PAYMENT_PROVIDER:  stripe
          STRIPE_SECRET_KEY: sk_test_local
          APIGW_WS_ENDPOINT: "http://localhost:3001"
          SNS_OPS_TOPIC_ARN: "arn:aws:sns:ca-central-1:000000000000:chonkychonk-ops-alerts"
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: chonkychonk-bus
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: "*"
      Events:
        OnOrderCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.orders"]
              detail-type: ["OrderCreated"]

  # ----------------------------------------------------------
  # Email Lambda  —  EventBridge target (all email events)
  # ----------------------------------------------------------
  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: chonkychonk-email-local
      CodeUri:      lambdas/mailer
      Handler:      lambda_handler.lambda_handler
      Description:  Sends all transactional and ops emails via SES
      Environment:
        Variables:
          EMAIL_PROVIDER:      ses
          EMAIL_FROM_ADDRESS:  "orders@chonkychonk.local"
          EMAIL_FROM_NAME:     "ChonkyChonk"
          SUPPORT_EMAIL:       "support@chonkychonk.local"
          LOW_STOCK_RECIPIENT: "ops@chonkychonk.local"
      Policies:
        - SESCrudPolicy:
            IdentityName: "orders@chonkychonk.local"
      Events:
        OnPaymentSettled:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.payments"]
              detail-type: ["PaymentSettled"]
        OnPaymentFailed:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.payments"]
              detail-type: ["PaymentFailed"]
        OnRefundComplete:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.payments"]
              detail-type: ["RefundComplete"]
        OnLowStock:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.orders"]
              detail-type: ["LowStockDetected"]
        OnUserRegistered:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.users"]
              detail-type: ["UserRegistered"]
        OnPasswordReset:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.users"]
              detail-type: ["PasswordResetRequest"]
        OnOrderSummary:
          Type: EventBridgeRule
          Properties:
            EventBusName: chonkychonk-bus
            Pattern:
              source:      ["chonkychonk.users"]
              detail-type: ["OrderSummaryRequest"]

  # ----------------------------------------------------------
  # WebSocket Lambda  —  $connect / $disconnect / notify
  # ----------------------------------------------------------
  WebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: chonkychonk-websocket-local
      CodeUri:      lambdas/websocket
      Handler:      lambda_handler.lambda_handler
      Description:  API Gateway WebSocket handler

# ============================================================
# Outputs
# ============================================================
Outputs:
  ProductsApi:
    Description: Products endpoint
    Value: "http://localhost:3000/products"

  OrdersApi:
    Description: Orders endpoint
    Value: "http://localhost:3000/orders"

  UsersApi:
    Description: Users endpoint
    Value: "http://localhost:3000/users/{id}"