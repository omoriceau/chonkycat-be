name: SonarQube

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read   # lets the scan decorate PRs with issues found

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # SonarQube needs full history for blame/new-code analysis

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Each lambda's tests/ package is named "tests", so running two
      # lambdas' suites in the *same* pytest process collides on the
      # "tests.conftest" module name (ImportPathMismatchError) — each
      # lambda's suite must run as its own subprocess. It also must run
      # from the repo root, not cd'd into the lambda dir: `python -m
      # pytest` puts the current directory on sys.path, which is how
      # `from shared.cors import ...` resolves (each lambda's own
      # conftest.py separately puts the lambda dir itself on sys.path, for
      # bare imports like `common`/`db`/`handlers`). A venv per lambda also
      # keeps one lambda's pinned dev deps from fighting another's. Only
      # lambdas that opt in with a requirements-dev.txt get a coverage.xml
      # — see CICD.md.
      - name: Run tests with coverage
        run: |
          set -e
          for dir in lambdas/*/; do
            [ -f "${dir}requirements-dev.txt" ] || continue
            name=$(basename "$dir")
            echo "::group::Coverage — $name"
            python -m venv ".venv-$name"
            ".venv-$name/bin/pip" install -q -r "${dir}requirements-dev.txt"
            # --cov=. (repo root), not --cov="$dir" --cov=shared: when a
            # lambda's own file shares a basename with a shared/ file (e.g.
            # every lambda has a db.py, and so does shared/), pytest-cov
            # computes each class's XML filename relative to whichever
            # --cov root matched, so both collapse to the same bare
            # "db.py" entry — coverage.py then silently keeps only one and
            # drops the other's data entirely. Using the repo root as the
            # sole --cov target makes every filename a full, unambiguous
            # path (lambdas/orders/db.py vs shared/db.py) while still only
            # reporting files this lambda's tests actually imported —
            # coverage.py's "list unmeasured files too" pass only walks
            # packages that were at least partially imported (e.g. shared,
            # via `from shared.cors import ...`), so unrelated lambdas
            # don't leak into this report.
            ".venv-$name/bin/python" -m pytest "${dir}tests" \
              --cov=. --cov-config=.coveragerc \
              --cov-report=xml:"${dir}coverage.xml"
            rm -rf ".venv-$name"
            echo "::endgroup::"
          done

      - name: Check SONAR_TOKEN is configured
        id: check-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::warning::SONAR_TOKEN secret is not set — skipping SonarQube scan. See CICD.md to configure sonar-project.properties + the secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.check-token.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL is deliberately not set here. GitHub Actions
          # substitutes an unset secret as an empty string rather than
          # omitting the env var, and the scanner CLI errors out
          # ("URI with undefined scheme") if SONAR_HOST_URL is present
          # but empty — it doesn't just fall back to SonarCloud's default
          # the way an absent variable would. If you ever move to a
          # self-hosted SonarQube Server, add this line back at the same
          # time you set the SONAR_HOST_URL secret, not before.
