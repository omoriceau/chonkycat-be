name: Deploy ChonkyChonk Backend

on:
  push:
    branches: [master]     # deploys to dev (auto) + prod (gated) on every push
  pull_request:
    branches: [master]     # build + validate only, no deploy

permissions:
  id-token: write          # required for OIDC auth to AWS (no long-lived keys stored)
  contents: read

jobs:

  # ============================================================
  # Build and validate on every PR — catches errors before merge
  # ============================================================
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: SAM build
        run: sam build

      - name: SAM validate
        run: sam validate --lint

  # ============================================================
  # Deploy to dev on every push to master
  # ============================================================
  deploy-dev:
    name: Deploy → Dev
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      # Authenticate via OIDC — no AWS access keys stored in GitHub secrets
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     us-east-1

      - name: Deploy
        run: |
          chmod +x ci-deploy.sh
          ./ci-deploy.sh --environment dev

  # ============================================================
  # Deploy to prod on every push to master — but only once prod
  # infra actually exists. As of now it doesn't (no prod Cognito
  # pools / DynamoDB tables provisioned in AWS yet), so this job
  # is gated behind the vars.PROD_ENABLED repo variable and no-ops
  # until that's flipped on:
  #
  #   repo Settings → Secrets and variables → Actions → Variables
  #   → New repository variable → name PROD_ENABLED, value true
  #
  # Also gated behind the 'prod' GitHub Environment's
  # required-reviewer approval. Configure the reviewer(s) once:
  # repo Settings → Environments → prod → Required reviewers.
  #
  # All prod-specific config (table names, Cognito pool IDs, SES
  # domain, alert email) lives in samconfig.toml's
  # [prod.deploy.parameters] section, not GitHub secrets — none of
  # it is actually sensitive, and keeping it in one versioned file
  # is what makes ci-deploy.sh's checks meaningful. Fill in that
  # section's TODO-* placeholders before flipping PROD_ENABLED on;
  # ci-deploy.sh refuses to run while any remain. Only the IAM role
  # ARN below is a real secret (it gates AWS account access itself).
  #
  # ci-deploy.sh also expects the prod DynamoDB tables / S3 bucket /
  # EventBridge bus to already exist — it only verifies, it never
  # creates or deletes anything. Run deploy-products.sh manually,
  # once, to provision a new environment first.
  # ============================================================
  deploy-prod:
    name: Deploy → Prod
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.PROD_ENABLED == 'true'
    environment: prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310  # v3

      # Authenticate via OIDC — no AWS access keys stored in GitHub secrets
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region:     us-east-1

      - name: Deploy
        run: |
          chmod +x ci-deploy.sh
          ./ci-deploy.sh --environment prod
