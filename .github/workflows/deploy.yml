name: Deploy ChonkyChonk Backend

on:
  push:
    branches: [main]       # deploys to dev on every push
  pull_request:
    branches: [main]       # build + validate only, no deploy

permissions:
  id-token: write          # required for OIDC auth to AWS (no long-lived keys stored)
  contents: read

jobs:

  # ============================================================
  # Build and validate on every PR — catches errors before merge
  # ============================================================
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build --config-env dev

      - name: SAM validate
        run: sam validate --lint

  # ============================================================
  # Deploy to dev on every push to main
  # ============================================================
  deploy-dev:
    name: Deploy → Dev
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      # Authenticate via OIDC — no AWS access keys stored in GitHub secrets
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     us-east-1

      - name: Deploy
        run: |
          chmod +x deploy-products.sh
          ./deploy-products.sh --environment dev --region us-east-1