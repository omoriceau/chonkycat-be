# samconfig.toml
# Stores deployment settings per environment.
# Safe to commit — contains no secrets.
# Secrets are injected at deploy time from .env (local) or GitHub secrets (CI).

version = 0.1

# ============================================================
# LOCAL — Docker + SAM local invoke (no AWS resources)
# ============================================================
[local.build.parameters]
# Use template.local.yaml for local dev
template = "template.local.yaml"

[local.local_start_api.parameters]
port = 3000
warm_containers = "EAGER"

# ============================================================
# DEV
# ============================================================
[dev.deploy.parameters]
stack_name        = "chonkychonk-dev"
region            = "ca-central-1"
confirm_changeset = false
capabilities      = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-dev"
resolve_s3        = false

parameter_overrides = [
  "Environment=dev",
  "DBHost=$DB_HOST",
  "DBPort=$DB_PORT",
  "DBUser=$DB_USER",
  "DBPassword=$DB_PASSWORD",
  "DBName=chonky",
  "VpcId=$VPC_ID",
  "SubnetIds=$SUBNET_IDS",
  "SecurityGroupId=$SECURITY_GROUP_ID",
  "EventBusName=chonkychonk-bus",
  "CognitoEnabled=false",
  "CognitoUserPoolId=none",
  "CognitoAppClientId=none",
  "ApigwWsEndpoint=none",
  "SnsOpsTopicArn=none",
]

# ============================================================
# STAGING
# ============================================================
[staging.deploy.parameters]
stack_name        = "chonkychonk-staging"
region            = "ca-central-1"
confirm_changeset = true
capabilities      = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-staging"
resolve_s3        = false

parameter_overrides = [
  "Environment=staging",
  "DBHost=$DB_HOST",
  "DBPort=$DB_PORT",
  "DBUser=$DB_USER",
  "DBPassword=$DB_PASSWORD",
  "DBName=chonky",
  "VpcId=$VPC_ID",
  "SubnetIds=$SUBNET_IDS",
  "SecurityGroupId=$SECURITY_GROUP_ID",
  "EventBusName=chonkychonk-bus",
  "CognitoEnabled=false",
  "CognitoUserPoolId=none",
  "CognitoAppClientId=none",
  "ApigwWsEndpoint=none",
  "SnsOpsTopicArn=none",
]

# ============================================================
# PROD
# ============================================================
[prod.deploy.parameters]
stack_name        = "chonkychonk-prod"
region            = "ca-central-1"
confirm_changeset = true    # always review the changeset before applying to prod
capabilities      = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-prod"
resolve_s3        = false

parameter_overrides = [
  "Environment=prod",
  "DBHost=$DB_HOST",
  "DBPort=$DB_PORT",
  "DBUser=$DB_USER",
  "DBPassword=$DB_PASSWORD",
  "DBName=chonky",
  "VpcId=$VPC_ID",
  "SubnetIds=$SUBNET_IDS",
  "SecurityGroupId=$SECURITY_GROUP_ID",
  "EventBusName=chonkychonk-bus",
  "CognitoEnabled=true",
  "CognitoUserPoolId=$COGNITO_USER_POOL_ID",
  "CognitoAppClientId=$COGNITO_APP_CLIENT_ID",
  "ApigwWsEndpoint=$APIGW_WS_ENDPOINT",
  "SnsOpsTopicArn=$SNS_OPS_TOPIC_ARN",
]