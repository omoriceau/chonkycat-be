# samconfig.toml
# Stores deployment settings per environment.
# Safe to commit — contains no secrets.
# Secrets are injected at deploy time from environment variables or AWS Secrets Manager.
#
# Usage: sam deploy -g (guided), then sam deploy (automated)
# Set environment variables before deploying: DB_HOST, DB_PORT, DB_USER, VPC_ID, etc.
# Secret names should reference AWS Secrets Manager resources that exist in your account.

version = 0.1

# ============================================================
# DEV
# ============================================================
[dev.deploy.parameters]
stack_name        = "chonkychonk-products-dev"
region            = "us-east-1"
confirm_changeset = false
capabilities      = "CAPABILITY_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-dev"
resolve_s3        = false
parameter_overrides = [
  "Environment=dev",
  "UsersTableName=chonky-users-dev",
  "ProductsTableName=chonky-products-dev",
  "OrdersTableName=chonky-orders-dev",
  "PaymentsTableName=chonky-payments-dev",
  "PromotionsTableName=chonky-promotions-dev",
  "EventBusName=chonkychonk-bus",
  "CognitoUserPoolId=us-east-1_tzozLyJBF",
  "CustomerCognitoUserPoolId=us-east-1_RN8iM0OaC",
  "CustomerCognitoAppClientId=607ej6ubfsn7o6q131f60f4kfc",
  "StripeSecretKeySecretName=chonky/dev/stripe_secret_key",
  "StripeWebhookSecretName=chonky/dev/stripe_webhook_secret",
  "DevEmail=dev@example.com",
]
