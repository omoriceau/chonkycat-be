# samconfig.toml
# Stores deployment settings per environment.
# Safe to commit — contains no secrets.
# Secrets are injected at deploy time from environment variables or AWS Secrets Manager.
#
# Usage: sam deploy -g (guided), then sam deploy (automated)
# Set environment variables before deploying: DB_HOST, DB_PORT, DB_USER, VPC_ID, etc.
# Secret names should reference AWS Secrets Manager resources that exist in your account.

version = 0.1

# ============================================================
# DEV
# ============================================================
[dev.deploy.parameters]
stack_name        = "chonkychonk-products-dev"
region            = "us-east-1"
confirm_changeset = false
capabilities      = "CAPABILITY_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-dev"
resolve_s3        = false
parameter_overrides = [
  "Environment=dev",
  "UsersTableName=chonky-users-dev",
  "ProductsTableName=chonky-products-dev",
  "OrdersTableName=chonky-orders-dev",
  "PaymentsTableName=chonky-payments-dev",
  "PromotionsTableName=chonky-promotions-dev",
  "EventBusName=chonkychonk-bus",
  "CognitoUserPoolId=us-east-1_Yu0PpHM7o",
  "CustomerCognitoUserPoolId=us-east-1_s490UBXYr",
  "CustomerCognitoAppClientId=4tkc65e88is0mkrem9k3llcsdi",
  "StripeSecretKeySecretName=chonky/dev/stripe_secret_key",
  "StripeWebhookSecretName=chonky/dev/stripe_webhook_secret",
  "DevEmail=dev@example.com",
]

# ============================================================
# PROD (stub — neither ci-deploy.sh nor deploy-products.sh reads this
# section; see the note below. Fill in for manual `sam deploy -g` use only.)
# ============================================================
[prod.deploy.parameters]
stack_name        = "chonkychonk-products-prod"
region            = "us-east-1"
confirm_changeset = false
capabilities      = "CAPABILITY_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-prod"
resolve_s3        = false
parameter_overrides = [
  "Environment=prod",
  "UsersTableName=chonky-users-prod",
  "ProductsTableName=chonky-products-prod",
  "OrdersTableName=chonky-orders-prod",
  "PaymentsTableName=chonky-payments-prod",
  "PromotionsTableName=chonky-promotions-prod",
  "EventBusName=chonkychonk-bus",
  "CognitoUserPoolId=TODO-prod-admin-cognito-pool-id",
  "CustomerCognitoUserPoolId=TODO-prod-customer-cognito-pool-id",
  "CustomerCognitoAppClientId=TODO-prod-customer-cognito-app-client-id",
  "StripeSecretKeySecretName=chonky/prod/stripe_secret_key",
  "StripeWebhookSecretName=chonky/prod/stripe_webhook_secret",
  "DevEmail=TODO-prod-alert-email@example.com",
]
