# samconfig.toml
# Stores deployment settings per environment.
# Safe to commit — contains no secrets.
# Secrets are injected at deploy time from environment variables or AWS Secrets Manager.
#
# Usage: sam deploy -g (guided), then sam deploy (automated)
# Set environment variables before deploying: DB_HOST, DB_PORT, DB_USER, VPC_ID, etc.
# Secret names should reference AWS Secrets Manager resources that exist in your account.

version = 0.1

# ============================================================
# DEV
# ============================================================
[dev.deploy.parameters]
stack_name        = "chonkychonk-products-dev"
region            = "us-east-1"
confirm_changeset = false
capabilities      = "CAPABILITY_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-dev"
resolve_s3        = false
parameter_overrides = [
  "Environment=dev",
  "UsersTableName=chonky-users-dev",
  "ProductsTableName=chonky-products-dev",
  "OrdersTableName=chonky-orders-dev",
  "PaymentsTableName=chonky-payments-dev",
  "PromotionsTableName=chonky-promotions-dev",
  "EventBusName=chonkychonk-bus",
  "CognitoUserPoolId=us-east-1_Yu0PpHM7o",
  "CustomerCognitoUserPoolId=us-east-1_s490UBXYr",
  "CustomerCognitoAppClientId=4tkc65e88is0mkrem9k3llcsdi",
  "StripeSecretKeySecretName=chonky/dev/stripe_secret_key",
  "StripeWebhookSecretName=chonky/dev/stripe_webhook_secret",
  "DevEmail=dev@example.com",
]

# ============================================================
# PROD
# ============================================================
[prod.deploy.parameters]
stack_name        = "chonkychonk-products-production"
region            = "us-east-1"
confirm_changeset = false
capabilities      = "CAPABILITY_IAM"
s3_bucket         = "chonkychonk-sam-artifacts-production"
resolve_s3        = false
parameter_overrides = [
  "Environment=production",
  "UsersTableName=chonky-users-production",
  "ProductsTableName=chonky-products-production",
  "OrdersTableName=chonky-orders-production",
  "PaymentsTableName=chonky-payments-production",
  "PromotionsTableName=chonky-promotions-production",
  "EventBusName=chonkychonk-bus",
  "CognitoUserPoolId=us-east-1_7gHA2uONa",
  "CustomerCognitoUserPoolId=us-east-1_FwDwW9oJi",
  "CustomerCognitoAppClientId=7n2hj2gc2sub5itseoo4rnd9qq",
  "AmplifyAppId=d1k0utfil8j1iy",
  "StripeSecretKeySecretName=chonky/production/stripe_secret_key",
  "StripeWebhookSecretName=chonky/production/stripe_webhook_secret",
  "DevEmail=omoriceau@myseneca.ca",
]
