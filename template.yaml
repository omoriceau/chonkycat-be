AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ChonkyChonk Backend

# ============================================================
# Global defaults applied to every Lambda unless overridden
# ============================================================
Globals:
  Function:
    Runtime:       python3.13
    MemorySize:    256
    Timeout:       30
    Architectures: [x86_64]
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        EVENT_BUS_NAME:                 !Ref EventBusName
        STRIPE_SECRET_KEY_SECRET_NAME:  !Ref StripeSecretKeySecretName
        STRIPE_WEBHOOK_SECRET_NAME:     !Ref StripeWebhookSecretName
        ENVIRONMENT:                    !Ref Environment
        DEV_EMAIL:                      !Ref DevEmail

# ============================================================
# Parameters — set per environment via samconfig.toml
# ============================================================
Parameters:
  Environment:
    Type:    String
    Default: dev
    AllowedValues: [dev, staging, prod]

  EventBusName:
    Type:    String
    Default: chonkychonk-bus

  CognitoEnabled:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]

  CognitoUserPoolId:
    Type:    String
    Default: ""

  CognitoAppClientId:
    Type:    String
    Default: ""

  # ----------------------------------------------------------
  # Storefront-facing pool (chonky-cat-fe's Amplify Authenticator) —
  # separate from CognitoUserPoolId above, which the Users Lambda uses for
  # AdminCreateUser (staff/admin). The Orders Lambda uses this one to
  # verify Authorization bearer tokens on cart requests (identity.py) and
  # to authorize POST /cart/claim at the API Gateway level.
  # ----------------------------------------------------------
  CustomerCognitoUserPoolId:
    Type:    String
    Default: ""

  CustomerCognitoAppClientId:
    Type:    String
    Default: ""

  ApigwWsEndpoint:
    Type:        String
    Default:     ""
    Description: API Gateway WebSocket management endpoint

  SnsOpsTopicArn:
    Type:        String
    Default:     ""
    Description: SNS topic ARN for ops alerts (optional)

  StripeSecretKeyArn:
    Type:        String
    Default:     ""
    Description: ARN of the Secrets Manager secret holding STRIPE_SECRET_KEY

  StripeSecretKeySecretName:
    Type:    String
    Default: "chonky/dev/stripe_secret_key"
    Description: Name of the Secrets Manager secret holding STRIPE_SECRET_KEY

  StripeWebhookSecretName:
    Type:    String
    Default: "chonky/dev/stripe_webhook_secret"
    Description: Name of the Secrets Manager secret holding STRIPE_WEBHOOK_SECRET

  DevEmail:
    Type:    String
    Default: "dev@example.com"
    Description: Email address for receiving test emails in SES Sandbox mode (dev environment)

  # ----------------------------------------------------------
  # SES sending domain — the Cloudflare-hosted domain that no-reply@
  # lives under. Set via deploy-products.sh's --ses-domain flag /
  # SES_DOMAIN env var, which is also what actually provisions the SES
  # domain + email identities (see setup_ses() there). This parameter
  # feeds EMAIL_FROM_ADDRESS below — the env var ses_provider.py actually
  # reads — so EmailServiceFunction sends from an address SES has really
  # verified, instead of the module's hardcoded stale-domain default.
  #
  # Left blank by default so the stack still deploys before SES is set
  # up; ses_provider.py falls back to its own hardcoded default address
  # if EMAIL_FROM_ADDRESS comes through empty.
  # ----------------------------------------------------------
  SesDomain:
    Type:    String
    Default: ""
    Description: Cloudflare-hosted domain used for SES sending (no-reply@<domain>) — see deploy-products.sh setup_ses()

  # ----------------------------------------------------------
  # DynamoDB table names — Products, Orders, and Users read
  # these now. Payments/Promotions are listed too since Orders
  # already depends on Promotions, and Payments/StripeWebhook
  # will need PaymentsTableName once they're migrated (the env
  # var is wired up on them below already, ahead of that code
  # change, so no further template edits are needed then).
  #
  # No defaults on purpose — deploy.sh passes these explicitly,
  # built from the same name_prefix/env convention terraform
  # uses for the tables themselves.
  # ----------------------------------------------------------
  UsersTableName:
    Type:        String
    Description: DynamoDB table name for users (aws_dynamodb_table.users)

  ProductsTableName:
    Type:        String
    Description: DynamoDB table name for products (aws_dynamodb_table.products)

  OrdersTableName:
    Type:        String
    Description: DynamoDB table name for orders (aws_dynamodb_table.orders)

  PaymentsTableName:
    Type:        String
    Description: DynamoDB table name for payments (aws_dynamodb_table.payments)

  PromotionsTableName:
    Type:        String
    Description: DynamoDB table name for promotions (aws_dynamodb_table.promotions)

# ============================================================
# Conditions
# ============================================================
Conditions:
  HasStripeSecret: !Not [!Equals [!Ref StripeSecretKeyArn, ""]]
  # Lets the stack deploy before the storefront's Amplify pool exists yet
  # (CustomerCognitoUserPoolId defaults to "") — POST /cart/claim just runs
  # without the Cognito authorizer attached until it's set.
  HasCustomerCognitoPool: !Not [!Equals [!Ref CustomerCognitoUserPoolId, ""]]
  # Lets the stack deploy before SES has been set up (SesDomain defaults
  # to "") — EmailServiceFunction just gets an empty EMAIL_FROM_ADDRESS
  # until setup_ses() in deploy-products.sh has run and this parameter is
  # passed on a subsequent deploy.
  HasSesDomain: !Not [!Equals [!Ref SesDomain, ""]]

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # API Gateway (implicit)  —  auto-created by SAM for all
  # Lambda API events. No explicit stage name = root path.
  # ----------------------------------------------------------
  ChonkyRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      OpenApiVersion: '3.0.1'
      # Only used by POST /cart/claim + the self-service profile routes
      # (see GetUserById/PutUser/ClaimCart below) — every other route stays
      # unauthenticated at the API Gateway level, since the cart routes
      # have to accept both guest and logged-in callers.
      #
      # NOTE: this Authorizers map has to be declared unconditionally —
      # SAM's Api-resource Auth property doesn't support Fn::If (sam
      # validate rejects it with "Invalid value for 'Auth' property"; it
      # was previously wrapped in !If [HasCustomerCognitoPool, ...] and
      # silently ignored instead of erroring, because this resource used
      # to be misnamed ServerlessRestApi — SAM's reserved logical ID for
      # its own auto-generated implicit API — which quietly dropped this
      # entire Auth property at transform time instead of validating it.
      # Each route that wants this authorizer still opts in individually
      # via its own per-event `Auth: !If [HasCustomerCognitoPool, ...]`.
      Auth:
        Authorizers:
          CustomerCognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CustomerCognitoUserPoolId}"

  # ----------------------------------------------------------
  # Shared Layer  —  contains shared/db.py and any other
  # common modules used across Lambdas.
  #
  # Directory layout expected on disk:
  #   shared/
  #   └── python/
  #       ├── __init__.py
  #       └── db.py
  #
  # The python/ subfolder is required — Lambda adds it to
  # sys.path automatically, making `from shared.db import …`
  # work in every function that includes this layer.
  # ----------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:                !Sub chonkychonk-shared-${Environment}
      ContentUri:               shared/python/
      CompatibleRuntimes:       [python3.13]
      CompatibleArchitectures:  [x86_64]
    Metadata:
      BuildMethod: python3.13

  # ----------------------------------------------------------
  # EventBridge bus — created imperatively by deploy-products.sh
  # (aws events create-event-bus) before this stack deploys, so it
  # is NOT declared here. Declaring it as a stack resource fails
  # CloudFormation's early-validation ResourceExistenceCheck once
  # the bus already exists outside the stack.
  # ----------------------------------------------------------

  # ----------------------------------------------------------
  # Products Lambda  —  full CRUD: GET/POST/PUT/PATCH/DELETE
  # /products and /products/{productid}. DynamoDB, no VPC.
  #
  # Image uploads (POST .../image) write into chonky-images-<env> — the
  # same bucket chonky-cat-fe's scripts/push-images.mjs provisions and
  # serves at https://img.chonkycat.ca. That bucket is created imperatively
  # (aws s3api, not IaC) and its bucket policy already grants public
  # GetObject on img/* — it is NOT declared as a stack resource here, only
  # referenced by name, the same way the EventBridge bus above is. This
  # Lambda only needs PutObject on that one prefix; reads are public.
  #
  # Auth is not configured in this template (see the
  # ChonkyRestApi comment above) — it's attached externally
  # via scripts/attach-cognito-authorizer.sh, which needs an
  # entry for each of CreateProduct/UpdateProduct/PatchProduct/
  # DeleteProduct/UploadProductImage/UploadImageForSku below, while leaving
  # GetProducts and GetProductById public so the storefront can
  # browse/view products without signing in.
  # ----------------------------------------------------------
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-products-${Environment}
      CodeUri:      lambdas/products/
      Handler:      lambda_handler.lambda_handler
      Description:  Product catalog CRUD - GET (public) / POST/PUT/PATCH/DELETE (authenticated) /products
      Environment:
        Variables:
          PRODUCTS_TABLE_NAME:   !Ref ProductsTableName
          PRODUCT_IMAGES_BUCKET: !Sub chonky-images-${Environment}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTableName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::chonky-images-${Environment}/img/*"
      Events:
        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products
            Method: GET
        GetProductById:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}
            Method: GET
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products
            Method: POST
        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}
            Method: PUT
        PatchProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}
            Method: PATCH
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}
            Method: DELETE
        UploadProductImage:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}/image
            Method: POST
        ProductImagePreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}/image
            Method: OPTIONS
        UploadImageForSku:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/image
            Method: POST
        UploadImageForSkuPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/image
            Method: OPTIONS
        ProductsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products
            Method: OPTIONS
        ProductByIdPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /products/{productid}
            Method: OPTIONS

  # ----------------------------------------------------------
  # Stripe Intent Lambda  —  NO VPC, calls Stripe API
  # ----------------------------------------------------------
  StripeIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-stripe-intent-${Environment}
      CodeUri:      lambdas/stripe_intent/
      Handler:      lambda_handler.lambda_handler
      Description:  Calls Stripe PaymentIntent API (no VPC, needs public internet)
      # No VpcConfig here intentionally
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StripeSecretKeySecretName}-*"

  # ----------------------------------------------------------
  # Email Service Lambda  —  generic email handler for all events
  # ----------------------------------------------------------
  EmailServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-email-service-${Environment}
      CodeUri:      lambdas/email_service/
      Handler:      lambda_handler.lambda_handler
      Description:  Generic email service for sending emails triggered by EventBridge events
      # No VPC needed — only calls SES API
      Environment:
        Variables:
          # This is the env var ses_provider.py actually reads
          # (EMAIL_FROM_ADDRESS, not SES_FROM_EMAIL) — populated once
          # SesDomain is passed, after setup_ses() in deploy-products.sh
          # has provisioned and verified the underlying SES identity.
          #
          # Omitted entirely via AWS::NoValue rather than set to "" when
          # SES isn't configured yet: os.environ.get()'s own fallback only
          # kicks in when the key is absent, not when it's present-but-
          # empty, so "" here would send with a blank FROM address instead
          # of falling back to ses_provider.py's own hardcoded default.
          EMAIL_FROM_ADDRESS: !If [HasSesDomain, !Sub "no-reply@${SesDomain}", !Ref AWS::NoValue]
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        OrderEmailEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBusName
            Pattern:
              source:
                - chonkychonk.orders
                - chonkychonk.users
              detail-type:
                - OrderCreated
                - OrderFailure
                - LowStockDetected
                - UserCreated

  # ----------------------------------------------------------
  # Orders Lambda  —  POST/GET/PUT/DELETE /orders (shopping cart)
  # DynamoDB, no VPC. Touches orders + products (stock decrement,
  # reorder_flag maintenance) + promotions (read-only).
  # ----------------------------------------------------------
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-orders-${Environment}
      CodeUri:      lambdas/orders/
      Handler:      lambda_handler.lambda_handler
      Description:  Shopping cart CRUD - POST/GET/PUT/DELETE /orders
      Environment:
        Variables:
          ORDERS_TABLE_NAME:               !Ref OrdersTableName
          PRODUCTS_TABLE_NAME:             !Ref ProductsTableName
          PROMOTIONS_TABLE_NAME:           !Ref PromotionsTableName
          CUSTOMER_COGNITO_USER_POOL_ID:   !Ref CustomerCognitoUserPoolId
          CUSTOMER_COGNITO_APP_CLIENT_ID:  !Ref CustomerCognitoAppClientId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref PromotionsTableName
        # DynamoDBCrudPolicy doesn't include TransactWriteItems —
        # order creation/update uses it (order + items + stock
        # decrement as one atomic write), so it's granted explicitly.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProductsTableName}"
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
      Events:
        # No explicit Auth block — same as GetUsers, so it picks up the
        # general admin Cognito authorizer via attach-cognito-authorizer.sh.
        # Order data (even the list's minimal fields) isn't public.
        GetOrders:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders
            Method: GET
        PostOrders:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders
            Method: POST
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders/{orderId}
            Method: GET
        PutOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders/{orderId}
            Method: PUT
        DeleteOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders/{orderId}
            Method: DELETE
        OrdersPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders
            Method: OPTIONS
        OrderByIdPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /orders/{orderId}
            Method: OPTIONS

        # ---- Customer "my orders" (self-verifying bearer token via
        # identity.py, same as the cart routes below — no admin authorizer
        # here, unlike GET /orders above) ----
        GetMyOrders:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users/orders
            Method: GET
        MyOrdersPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users/orders
            Method: OPTIONS

        # ---- Cart (guest or logged-in — see lambda_handler.py/identity.py) ----
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart
            Method: GET
        CartPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart
            Method: OPTIONS
        AddCartItem:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/items
            Method: POST
        CartItemsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/items
            Method: OPTIONS
        UpdateCartItem:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/items/{productId}
            Method: PUT
        RemoveCartItem:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/items/{productId}
            Method: DELETE
        CartItemByIdPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/items/{productId}
            Method: OPTIONS
        CheckoutCart:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/{orderId}/checkout
            Method: POST
        CheckoutCartPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/{orderId}/checkout
            Method: OPTIONS
        # The only cart route behind the Cognito authorizer — see the
        # ChonkyRestApi/HasCustomerCognitoPool comments above.
        ClaimCart:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/claim
            Method: POST
            # NOTE: unconditional, not gated by HasCustomerCognitoPool — SAM's
            # transform silently drops Fn::If in a per-event Auth property
            # instead of erroring (confirmed via a throwaway change set), the
            # same way it silently dropped Fn::If on the API-level Auth
            # property above. CustomerCognitoUserPoolId is always set in
            # practice (see deploy-products.sh defaults), so this is safe.
            Auth:
              Authorizer: CustomerCognitoAuthorizer
        ClaimCartPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /cart/claim
            Method: OPTIONS

  # ----------------------------------------------------------
  # Users Lambda  —  POST/GET/PUT/DELETE /users (user management)
  # DynamoDB, no VPC.
  # ----------------------------------------------------------
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-users-${Environment}
      CodeUri:      lambdas/users/
      Handler:      lambda_handler.lambda_handler
      Description:  User CRUD - POST/GET/PUT/DELETE /users
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTableName
        # Needed for the email-uniqueness lock-item pattern (create/update
        # write the user + its email lock atomically). Not covered by
        # DynamoDBCrudPolicy.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
        # Create/delete/set-password/update-email on the Cognito side of a
        # user's account — the users table itself never stores a password.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
              Resource:
                - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users
            Method: GET
        # Self-service profile routes — a signed-in shopper viewing/editing
        # their own profile (see Profile.jsx). Behind the same customer
        # Cognito authorizer as POST /cart/claim (HasCustomerCognitoPool
        # condition on ChonkyRestApi); lambda_handler.py additionally
        # checks the caller's verified sub matches the {userId} in the
        # path, so nobody can read/edit anyone else's profile just by
        # knowing their id. GetUsers/PostUsers/DeleteUser are unrelated
        # admin operations and stay as they were.
        #
        # The admin panel does NOT use these — it can't: its tokens come
        # from the chonkychonk-admin pool, not this customer one, so
        # they'd be rejected by CustomerCognitoAuthorizer before even
        # reaching the self-sub check. It uses AdminGetUserById/AdminPutUser
        # below instead (same {userId} shape, no self-only restriction,
        # under the general admin Cognito authorizer attached externally
        # via attach-cognito-authorizer.sh — same as GetUsers/PostUsers/
        # DeleteUser).
        GetUserById:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users/{userId}
            Method: GET
            # NOTE: unconditional, not gated by HasCustomerCognitoPool — SAM's
            # transform silently drops Fn::If in a per-event Auth property
            # instead of erroring (confirmed via a throwaway change set), the
            # same way it silently dropped Fn::If on the API-level Auth
            # property above. CustomerCognitoUserPoolId is always set in
            # practice (see deploy-products.sh defaults), so this is safe.
            Auth:
              Authorizer: CustomerCognitoAuthorizer
        PostUsers:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users
            Method: POST
        PutUser:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users/{userId}
            Method: PUT
            # NOTE: unconditional, not gated by HasCustomerCognitoPool — SAM's
            # transform silently drops Fn::If in a per-event Auth property
            # instead of erroring (confirmed via a throwaway change set), the
            # same way it silently dropped Fn::If on the API-level Auth
            # property above. CustomerCognitoUserPoolId is always set in
            # practice (see deploy-products.sh defaults), so this is safe.
            Auth:
              Authorizer: CustomerCognitoAuthorizer
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users/{userId}
            Method: DELETE
        # Admin equivalents of GetUserById/PutUser — see the comment on
        # GetUserById above. No explicit Auth block, same as GetUsers/
        # PostUsers/DeleteUser: attach-cognito-authorizer.sh attaches the
        # admin (chonkychonk-admin pool) authorizer to these by default,
        # since they're not in its public-route exclude list.
        AdminGetUserById:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /admin/users/{userId}
            Method: GET
        AdminPutUser:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /admin/users/{userId}
            Method: PUT
        AdminUserByIdPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /admin/users/{userId}
            Method: OPTIONS
        UsersPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users
            Method: OPTIONS
        UserByIdPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /users/{userId}
            Method: OPTIONS

  # ----------------------------------------------------------
  # Payments Lambda  —  charge / refund via EventBridge
  #
  # Migrated to DynamoDB (lambdas/payments_api/db.py) — reads an order +
  # its user's email, invokes StripeIntentFunction, and records a payment
  # attempt (payments table, sk="PAYMENT#<intent_id>") so
  # stripe_webhook can find it later via ProviderTxnIndex.
  # ----------------------------------------------------------
  PaymentsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-payments-api-${Environment}
      CodeUri:      lambdas/payments_api/
      Handler:      lambda_handler.lambda_handler
      Description:  Accepts POST /payments, creates orders, invokes StripeIntentFunction
      Environment:
        Variables:
          STRIPE_INTENT_FUNCTION_ARN: !GetAtt StripeIntentFunction.Arn
          PAYMENTS_TABLE_NAME:        !Ref PaymentsTableName
          ORDERS_TABLE_NAME:          !Ref OrdersTableName
          USERS_TABLE_NAME:           !Ref UsersTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTableName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
        - LambdaInvokePolicy:
            FunctionName: !Ref StripeIntentFunction
      Events:
        PostPayment:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /payments
            Method: POST
        PaymentsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /payments
            Method: OPTIONS

  # ----------------------------------------------------------
  # Stripe Webhook Lambda  —  listens for Stripe events
  #
  # Migrated to DynamoDB (lambdas/stripe_webhook/db.py) — updates the
  # order's status directly and, via ProviderTxnIndex, the matching
  # payment record payments_api wrote when the intent was created.
  #
  # Must stay excluded from attach-cognito-authorizer.sh — Stripe
  # calls this directly and signs the request with its own webhook
  # secret (verified in the handler), not a Cognito token.
  # ----------------------------------------------------------
  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-stripe-webhook-${Environment}
      CodeUri:      lambdas/stripe_webhook/
      Handler:      lambda_handler.lambda_handler
      Description:  Receives Stripe webhook events and updates order status
      Environment:
        Variables:
          STRIPE_WEBHOOK_SECRET_NAME: !Ref StripeWebhookSecretName
          PAYMENTS_TABLE_NAME:        !Ref PaymentsTableName
          ORDERS_TABLE_NAME:          !Ref OrdersTableName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StripeWebhookSecretName}-*"
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTableName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
      Events:
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ChonkyRestApi
            Path:   /webhook
            Method: POST

# ============================================================
# Outputs — printed after every deploy, useful for wiring
# up WebSocket endpoint, Cognito, and frontend config
# ============================================================
Outputs:
  ProductsApi:
    Description: Products endpoint
    Value: !Sub "https://${ChonkyRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/products"

  UsersApi:
    Description: Users endpoint
    Value: !Sub "https://${ChonkyRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/users"

  OrdersApi:
    Description: Orders (one-shot placement) endpoint
    Value: !Sub "https://${ChonkyRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/orders"

  CartApi:
    Description: Cart endpoint (guest or logged-in)
    Value: !Sub "https://${ChonkyRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/cart"

  PaymentsApi:
    Description: Payments endpoint
    Value: !Sub "https://${ChonkyRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/payments"

  WebhookApi:
    Description: Stripe webhook endpoint
    Value: !Sub "https://${ChonkyRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/webhook"

  EventBusArn:
    Description: EventBridge bus ARN
    Value: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}"

  StripeIntentFunctionArn:
    Description: Stripe Intent Lambda ARN
    Value: !GetAtt StripeIntentFunction.Arn

  UsersFunctionArn:
    Description: Users Lambda ARN
    Value: !GetAtt UsersFunction.Arn

  PaymentsApiFunctionArn:
    Description: Payments API Lambda ARN
    Value: !GetAtt PaymentsApiFunction.Arn

  OrdersFunctionArn:
    Description: Orders Lambda ARN
    Value: !GetAtt OrdersFunction.Arn

  StripeWebhookFunctionArn:
    Description: Stripe Webhook Lambda ARN
    Value: !GetAtt StripeWebhookFunction.Arn