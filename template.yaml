AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ChonkyChonk Backend

# ============================================================
# Global defaults applied to every Lambda unless overridden
# ============================================================
Globals:
  Function:
    Runtime:       python3.13
    MemorySize:    256
    Timeout:       30
    Architectures: [x86_64]
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        DB_HOST:        !Sub "${DBHost}"
        DB_PORT:        !Sub "${DBPort}"
        DB_USER:        !Sub "${DBUser}"
        DB_PASSWORD:    !Sub "${DBPassword}"
        DB_NAME:        !Ref DBName
        EVENT_BUS_NAME: !Ref EventBusName

# ============================================================
# Parameters — set per environment via samconfig.toml
# ============================================================
Parameters:
  Environment:
    Type:    String
    Default: dev
    AllowedValues: [dev, staging, prod]

  DBName:
    Type:    String
    Default: chonky

  DBHost:
    Type:    String
    Description: PostgreSQL RDS endpoint

  DBPort:
    Type:    String
    Default: "5432"
    Description: PostgreSQL port

  DBUser:
    Type:    String
    Description: Database user

  DBPassword:
    Type:    String
    NoEcho:  true
    Description: Database password

  VpcId:
    Type:        AWS::EC2::VPC::Id
    Description: VPC ID where RDS is deployed

  SubnetIds:
    Type:        List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda execution (must be in same VPC as RDS)

  SecurityGroupId:
    Type:        AWS::EC2::SecurityGroup::Id
    Description: Security group ID for Lambda (must allow egress to RDS security group)

  EventBusName:
    Type:    String
    Default: chonkychonk-bus

  CognitoEnabled:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]

  CognitoUserPoolId:
    Type:    String
    Default: ""

  CognitoAppClientId:
    Type:    String
    Default: ""

  ApigwWsEndpoint:
    Type:        String
    Default:     ""
    Description: API Gateway WebSocket management endpoint

  SnsOpsTopicArn:
    Type:        String
    Default:     ""
    Description: SNS topic ARN for ops alerts

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # Shared Layer  —  contains shared/db.py and any other
  # common modules used across Lambdas.
  #
  # Directory layout expected on disk:
  #   shared/
  #   └── python/
  #       ├── __init__.py
  #       └── db.py
  #
  # The python/ subfolder is required — Lambda adds it to
  # sys.path automatically, making `from shared.db import …`
  # work in every function that includes this layer.
  # ----------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:                !Sub chonkychonk-shared-${Environment}
      ContentUri:               shared/
      CompatibleRuntimes:       [python3.13]
      CompatibleArchitectures:  [x86_64]
    Metadata:
      BuildMethod: python3.13

  # ----------------------------------------------------------
  # EventBridge bus
  # ----------------------------------------------------------
  ChonkyEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref EventBusName

  # ----------------------------------------------------------
  # Products Lambda  —  GET /products
  # ----------------------------------------------------------
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-products-${Environment}
      CodeUri:      lambdas/products/
      Handler:      lambda_handler.lambda_handler
      Description:  GET /products
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Events:
        GetProducts:
          Type: Api
          Properties:
            Path:   /products
            Method: GET

# ============================================================
# Outputs — printed after every deploy, useful for wiring
# up WebSocket endpoint, Cognito, and frontend config
# ============================================================
Outputs:
  ProductsApi:
    Description: Products endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/products"

  EventBusArn:
    Description: EventBridge bus ARN
    Value: !GetAtt ChonkyEventBus.Arn