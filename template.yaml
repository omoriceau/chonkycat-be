AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ChonkyChonk Backend

# ============================================================
# Global defaults applied to every Lambda unless overridden
# ============================================================
Globals:
  Function:
    Runtime:       python3.13
    MemorySize:    256
    Timeout:       30
    Architectures: [x86_64]
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        DB_HOST:                        !Sub "${DBHost}"
        DB_PORT:                        !Sub "${DBPort}"
        DB_USER:                        !Sub "${DBUser}"
        DB_NAME:                        !Ref DBName
        EVENT_BUS_NAME:                 !Ref EventBusName
        DB_PASSWORD_SECRET_NAME:        !Ref DBPasswordSecretName
        STRIPE_SECRET_KEY_SECRET_NAME:  !Ref StripeSecretKeySecretName
        SSH_PRIVATE_KEY_SECRET_NAME:    !Ref SSHPrivateKeySecretName
        ENVIRONMENT:                    !Ref Environment
        DEV_EMAIL:                      !Ref DevEmail

# ============================================================
# Parameters — set per environment via samconfig.toml
# ============================================================
Parameters:
  Environment:
    Type:    String
    Default: dev
    AllowedValues: [dev]

  DBName:
    Type:    String
    Default: chonky

  DBHost:
    Type:    String
    Description: PostgreSQL RDS endpoint

  DBPort:
    Type:    String
    Default: "5432"
    Description: PostgreSQL port

  DBUser:
    Type:    String
    Description: Database user

  VpcId:
    Type:        AWS::EC2::VPC::Id
    Description: VPC ID where RDS is deployed

  SubnetIds:
    Type:        List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda execution (must be in same VPC as RDS)

  SecurityGroupId:
    Type:        AWS::EC2::SecurityGroup::Id
    Description: Security group ID for Lambda (must allow egress to RDS security group)

  EventBusName:
    Type:    String
    Default: chonkychonk-bus

  CognitoEnabled:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]

  CognitoUserPoolId:
    Type:    String
    Default: ""

  CognitoAppClientId:
    Type:    String
    Default: ""

  ApigwWsEndpoint:
    Type:        String
    Default:     ""
    Description: API Gateway WebSocket management endpoint

  SnsOpsTopicArn:
    Type:        String
    Default:     ""
    Description: SNS topic ARN for ops alerts (optional)

  StripeSecretKeyArn:
    Type:        String
    Default:     ""
    Description: ARN of the Secrets Manager secret holding STRIPE_SECRET_KEY

  DBPasswordSecretName:
    Type:    String
    Default: "chonky/dev/db_pass"
    Description: Name of the Secrets Manager secret holding DB_PASSWORD

  StripeSecretKeySecretName:
    Type:    String
    Default: "chonky/dev/stripe_secret_key"
    Description: Name of the Secrets Manager secret holding STRIPE_SECRET_KEY

  SSHPrivateKeySecretName:
    Type:    String
    Default: "chonky/dev/ssh_private_key"
    Description: Name of the Secrets Manager secret holding SSH_PRIVATE_KEY for schema loader

  DevEmail:
    Type:    String
    Default: "dev@example.com"
    Description: Email address for receiving test emails in SES Sandbox mode (dev environment)

# ============================================================
# Conditions
# ============================================================
Conditions:
  HasStripeSecret: !Not [!Equals [!Ref StripeSecretKeyArn, ""]]

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # API Gateway (implicit)  —  auto-created by SAM for all
  # Lambda API events. No explicit stage name = root path.
  # ----------------------------------------------------------
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  # ----------------------------------------------------------
  # Shared Layer  —  contains shared/db.py and any other
  # common modules used across Lambdas.
  #
  # Directory layout expected on disk:
  #   shared/
  #   └── python/
  #       ├── __init__.py
  #       └── db.py
  #
  # The python/ subfolder is required — Lambda adds it to
  # sys.path automatically, making `from shared.db import …`
  # work in every function that includes this layer.
  # ----------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:                !Sub chonkychonk-shared-${Environment}
      ContentUri:               shared/python/
      CompatibleRuntimes:       [python3.13]
      CompatibleArchitectures:  [x86_64]
    Metadata:
      BuildMethod: python3.13

  # ----------------------------------------------------------
  # EventBridge bus
  # ----------------------------------------------------------
  ChonkyEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref EventBusName

  # ----------------------------------------------------------
  # Products Lambda  —  GET /products and GET /products/{productid}
  # ----------------------------------------------------------
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-products-${Environment}
      CodeUri:      lambdas/products/
      Handler:      lambda_handler.lambda_handler
      Description:  GET /products and GET /products/{productid}
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DBPasswordSecretName}-*"
      Events:
        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /products
            Method: GET
        GetProductById:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /products/{productid}
            Method: GET

  # ----------------------------------------------------------
  # Stripe Intent Lambda  —  NO VPC, calls Stripe API
  # ----------------------------------------------------------
  StripeIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-stripe-intent-${Environment}
      CodeUri:      lambdas/stripe_intent/
      Handler:      lambda_handler.lambda_handler
      Description:  Calls Stripe PaymentIntent API (no VPC, needs public internet)
      # No VpcConfig here intentionally
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StripeSecretKeySecretName}-*"

  # ----------------------------------------------------------
  # Email Service Lambda  —  generic email handler for all events
  # ----------------------------------------------------------
  EmailServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-email-service-${Environment}
      CodeUri:      lambdas/email_service/
      Handler:      lambda_handler.lambda_handler
      Description:  Generic email service for sending emails triggered by EventBridge events
      # No VPC needed — only calls SES API
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        OrderEmailEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBusName
            Pattern:
              source:
                - chonkychonk.orders
              detail-type:
                - OrderCreated
                - OrderFailure
                - LowStockDetected

  # ----------------------------------------------------------
  # Orders Lambda  —  POST/GET/PUT/DELETE /orders (shopping cart)
  # ----------------------------------------------------------
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-orders-${Environment}
      CodeUri:      lambdas/orders/
      Handler:      lambda_handler.lambda_handler
      Description:  Shopping cart CRUD - POST/GET/PUT/DELETE /orders
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DBPasswordSecretName}-*"
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
      Events:
        PostOrders:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /orders
            Method: POST
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /orders/{orderId}
            Method: GET
        PutOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /orders/{orderId}
            Method: PUT
        DeleteOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /orders/{orderId}
            Method: DELETE

  # ----------------------------------------------------------
  # Payments Lambda  —  charge / refund via EventBridge
  # ----------------------------------------------------------
  # Update PaymentsApiFunction to pass StripeIntentFunction ARN and allow invoke
  PaymentsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chonkychonk-payments-api-${Environment}
      CodeUri:      lambdas/payments_api/
      Handler:      lambda_handler.lambda_handler
      Description:  Accepts POST /payments, creates orders, invokes StripeIntentFunction
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          STRIPE_INTENT_FUNCTION_ARN: !GetAtt StripeIntentFunction.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DBPasswordSecretName}-*"
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
        - LambdaInvokePolicy:
            FunctionName: !Ref StripeIntentFunction
      Events:
        PostPayment:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path:   /payments
            Method: POST
  
# ============================================================
# Outputs — printed after every deploy, useful for wiring
# up WebSocket endpoint, Cognito, and frontend config
# ============================================================
Outputs:
  ProductsApi:
    Description: Products endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/dev/products"

  OrdersApi:
    Description: Orders (shopping cart) endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/dev/orders"

  PaymentsApi:
    Description: Payments endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/dev/payments"

  EventBusArn:
    Description: EventBridge bus ARN
    Value: !GetAtt ChonkyEventBus.Arn

  StripeIntentFunctionArn:
    Description: Stripe Intent Lambda ARN
    Value: !GetAtt StripeIntentFunction.Arn

  PaymentsApiFunctionArn:
    Description: Payments API Lambda ARN
    Value: !GetAtt PaymentsApiFunction.Arn

  OrdersFunctionArn:
    Description: Orders Lambda ARN
    Value: !GetAtt OrdersFunction.Arn