services:
  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: chonkychonk-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: chonkychonk
      MYSQL_USER: chonky_user
      MYSQL_PASSWORD: chonky_password
    ports:
      - "33306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

volumes:
  mysql_data:
