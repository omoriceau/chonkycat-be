services:
  postgres:
    image: postgres:16-alpine
    container_name: chonkychonk-db
    environment:
      POSTGRES_DB: chonkychonk
      POSTGRES_USER: chonky_user
      POSTGRES_PASSWORD: chonky_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./docker/postgres/02-init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chonky_user -d chonkychonk"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

volumes:
  postgres_data:
